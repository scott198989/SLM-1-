[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-preparation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "jinja2==3.1.6", "tokenizers==0.22.2", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.11", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["cuda: requires an NVIDIA GPU", "slow: full-scale or extended validation"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
