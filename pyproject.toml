[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-preparation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "jinja2==3.1.6", "tokenizers==0.22.2", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]
