[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge1"
version = "0.1.0"
description = "An original recurrent engineering language model and private-data training system"
requires-python = ">=3.12"
dependencies = ["torch>=2.10,<2.11", "numpy>=2.2,<3", "tokenizers>=0.22,<0.23"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.11"]

[project.scripts]
forge = "forge1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["cuda: requires an NVIDIA GPU", "slow: full-scale or extended validation"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
