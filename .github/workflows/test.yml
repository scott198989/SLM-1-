name: FORGE correctness
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-tested.txt -e .
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/distributed_smoke.py --output runs/ddp-ci
